name: Update World Cup Calendars

on:
  schedule:
    # Poll throughout the tournament so completed-match results appear promptly.
    - cron: '7,37 * * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        if: ${{ env.ACT != 'true' }}
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Test calendar update behavior
        run: python -m unittest discover -s tests -v

      - name: Generate calendar files
        run: python scripts/generate.py

      - name: Commit and push changes
        if: ${{ env.ACT != 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A calendars/ data/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore: update FIFA World Cup 2026 calendars [skip ci]"
          git push
